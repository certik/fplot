[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
name = "fplot"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-flang = "bash scripts/build_flang.sh"
# Run binaries from repo root so relative paths like tests/out/*.svg resolve.
test-flang = "bash scripts/build_flang.sh && mkdir -p tests/out && ./build/flang/test_plots"
demo-flang = "bash scripts/build_flang.sh && ./build/flang/demo"

build-lfortran = "bash scripts/build_lfortran.sh"
test-lfortran = "bash scripts/build_lfortran.sh && mkdir -p tests/out && ./build/lfortran/test_plots"
demo-lfortran = "bash scripts/build_lfortran.sh && ./build/lfortran/demo"

mpl-refs = "python tests/gen_mpl_refs.py"
compare = "python tests/gen_mpl_refs.py && bash scripts/build_flang.sh && mkdir -p tests/out && ./build/flang/test_plots && python tests/compare_svgs.py"
compare-png = "python tests/gen_mpl_refs.py && bash scripts/build_flang.sh && mkdir -p tests/out && ./build/flang/test_plots && python tests/compare_pngs.py"

[dependencies]
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
cairosvg = ">=2.9.0,<3"
pillow = ">=12.3.0,<13"
lfortran = ">=0.64.0,<0.65"

[target.linux-64.dependencies]
flang_linux-64 = ">=22,<23"
