[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
name = "fplot"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-flang = "bash scripts/build_flang.sh"
# Run binaries from repo root so relative paths like tests/out/*.svg resolve.
test-flang = "bash scripts/build_flang.sh && mkdir -p tests/out && ./build/flang/test_plots"
demo-flang = "bash scripts/build_flang.sh && ./build/flang/demo"

build-lfortran = "bash scripts/build_lfortran.sh"
test-lfortran = "bash scripts/build_lfortran.sh && mkdir -p tests/out && ./build/lfortran/test_plots"
demo-lfortran = "bash scripts/build_lfortran.sh && ./build/lfortran/demo"

mpl-refs = "python tests/gen_mpl_refs.py"

# The four comparisons share their setup, so it is expressed once as a
# dependency rather than repeated in each command and run four times.
[tasks.compare]
cmd = "python tests/compare_svgs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-png]
cmd = "python tests/compare_pngs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-pdf]
cmd = "python tests/compare_pdfs.py"
depends-on = ["mpl-refs", "test-flang"]

[tasks.compare-eps]
cmd = "python tests/compare_eps.py"
depends-on = ["mpl-refs", "test-flang"]

[dependencies]
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
cairosvg = ">=2.9.0,<3"
pillow = ">=12.3.0,<13"
# pdftoppm, for rasterizing PDFs in tests/compare_pdfs.py
poppler = "*"
lfortran = ">=0.64.0,<0.65"
# gs, for rasterizing EPS in tests/compare_eps.py
ghostscript = ">=10.4.0,<11"

[target.linux-64.dependencies]
flang_linux-64 = ">=22,<23"
